<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>合并 PDF</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "SimSun", sans-serif;
    background: #fafafa;
    margin: 0;
    padding: 24px;
    color: #333;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .drop {
    border: 2px dashed #bbb;
    border-radius: 6px;
    padding: 32px;
    text-align: center;
    color: #888;
    cursor: pointer;
    background: #fff;
    transition: all 0.2s;
  }
  .drop:hover, .drop.over {
    border-color: #4a90d9;
    background: #f0f7ff;
    color: #4a90d9;
  }
  .drop input { display: none; }
  .toolbar {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    padding: 9px 18px;
    background: #4a90d9;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #357ab8; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  button.ghost {
    background: #fff;
    color: #4a90d9;
    border: 1px solid #4a90d9;
  }
  button.ghost:hover { background: #f0f7ff; }
  #status {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    display: none;
    line-height: 1.6;
  }
  #status.loading { display: block; background: #e8f4fd; color: #2a6fa8; }
  #status.error   { display: block; background: #fdecea; color: #c0392b; }
  #status.success { display: block; background: #eafaf1; color: #27ae60; }
  #list { margin-top: 18px; }
  .item {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 5px;
    padding: 10px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: grab;
    transition: box-shadow 0.15s;
  }
  .item:active { cursor: grabbing; }
  .item.dragging { opacity: 0.4; }
  .item.drop-target { box-shadow: 0 0 0 2px #4a90d9 inset; }
  .item .idx {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #4a90d9;
    color: #fff;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .item .name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .size { font-size: 12px; color: #999; flex-shrink: 0; }
  .item .remove {
    background: transparent;
    border: none;
    color: #c0392b;
    font-size: 18px;
    cursor: pointer;
    padding: 0 6px;
    line-height: 1;
  }
  .empty-tip {
    text-align: center;
    color: #bbb;
    font-size: 13px;
    padding: 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="drop" id="drop">
    <input type="file" id="file" accept=".pdf" multiple>
    <div>点击选择 PDF，或拖到这里（可多选，多次添加）</div>
  </div>

  <div class="toolbar">
    <button id="mergeBtn" disabled>合并并下载</button>
    <button class="ghost" id="clearBtn" disabled>清空</button>
  </div>

  <div id="status"></div>
  <div id="list"></div>
  <div class="empty-tip" id="emptyTip">还没有文件</div>
</div>

<!-- pdf-lib：改用 unpkg，稳定可靠 -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
(function () {
  // ---------- 兼容探测 pdf-lib 全局名 ----------
  function getPDFLib() {
    if (typeof window.PDFLib !== 'undefined' && window.PDFLib && window.PDFLib.PDFDocument) {
      return window.PDFLib;
    }
    if (typeof window.pdfLib !== 'undefined' && window.pdfLib && window.pdfLib.PDFDocument) {
      return window.pdfLib;
    }
    if (typeof window['pdf-lib'] !== 'undefined' && window['pdf-lib'] && window['pdf-lib'].PDFDocument) {
      return window['pdf-lib'];
    }
    return null;
  }

  var drop      = document.getElementById('drop');
  var fileEl    = document.getElementById('file');
  var mergeBtn  = document.getElementById('mergeBtn');
  var clearBtn  = document.getElementById('clearBtn');
  var statusEl  = document.getElementById('status');
  var listEl    = document.getElementById('list');
  var emptyTip  = document.getElementById('emptyTip');

  var items = [];
  var uid = 0;
  var dragId = null;

  function setStatus(type, msg) {
    statusEl.className = type;
    statusEl.textContent = msg;
  }
  function clearStatus() {
    statusEl.className = '';
    statusEl.textContent = '';
  }
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  // ---------- 库加载检查 ----------
  (function checkLib() {
    var lib = getPDFLib();
    if (!lib) {
      setStatus('error',
        'pdf-lib 库加载失败。请检查网络是否能访问 unpkg.com，' +
        '或按 Ctrl + F5 强制刷新页面。');
    } else {
      console.log('pdf-lib 已就绪，全局名：',
        window.PDFLib ? 'PDFLib' :
        window.pdfLib ? 'pdfLib' :
        window['pdf-lib'] ? 'pdf-lib' : '未知');
    }
  })();

  // ---------- 文件选择 ----------
  drop.addEventListener('click', function () { fileEl.click(); });
  fileEl.addEventListener('change', function (e) {
    if (e.target.files.length) addFiles(e.target.files);
    fileEl.value = '';
  });
  ['dragenter', 'dragover'].forEach(function (evt) {
    drop.addEventListener(evt, function (e) {
      e.preventDefault(); drop.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (evt) {
    drop.addEventListener(evt, function (e) {
      e.preventDefault(); drop.classList.remove('over');
    });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  function addFiles(fileList) {
    var added = 0;
    Array.prototype.forEach.call(fileList, function (f) {
      if (!/\.pdf$/i.test(f.name)) return;
      items.push({ id: ++uid, file: f, name: f.name, size: f.size });
      added++;
    });
    if (added === 0) {
      setStatus('error', '请选择 .pdf 文件');
      return;
    }
    clearStatus();
    render();
  }

  function render() {
    listEl.innerHTML = '';

    if (items.length === 0) {
      emptyTip.style.display = 'block';
      mergeBtn.disabled = true;
      clearBtn.disabled = true;
      return;
    }
    emptyTip.style.display = 'none';
    mergeBtn.disabled = false;
    clearBtn.disabled = false;

    items.forEach(function (item, index) {
      var el = document.createElement('div');
      el.className = 'item';
      el.draggable = true;
      el.dataset.id = item.id;

      el.innerHTML =
        '<span class="idx">' + (index + 1) + '</span>' +
        '<span class="name">' + item.name + '</span>' +
        '<span class="size">' + fmtSize(item.size) + '</span>' +
        '<button class="remove" title="移除">×</button>';

      el.querySelector('.remove').addEventListener('click', function (e) {
        e.stopPropagation();
        items = items.filter(function (it) { return it.id !== item.id; });
        render();
      });

      el.addEventListener('dragstart', function (e) {
        dragId = item.id;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', String(item.id)); } catch (err) {}
      });
      el.addEventListener('dragend', function () {
        dragId = null;
        el.classList.remove('dragging');
        Array.prototype.forEach.call(
          listEl.querySelectorAll('.drop-target'),
          function (n) { n.classList.remove('drop-target'); }
        );
      });
      el.addEventListener('dragover', function (e) {
        e.preventDefault();
        if (dragId === null || dragId === item.id) return;
        el.classList.add('drop-target');
      });
      el.addEventListener('dragleave', function () {
        el.classList.remove('drop-target');
      });
      el.addEventListener('drop', function (e) {
        e.preventDefault();
        el.classList.remove('drop-target');
        if (dragId === null || dragId === item.id) return;

        var fromIdx = items.findIndex(function (it) { return it.id === dragId; });
        var toIdx   = items.findIndex(function (it) { return it.id === item.id; });
        if (fromIdx < 0 || toIdx < 0) return;

        var moved = items.splice(fromIdx, 1)[0];
        items.splice(toIdx, 0, moved);
        render();
      });

      listEl.appendChild(el);
    });
  }

  clearBtn.addEventListener('click', function () {
    if (!confirm('清空所有文件？')) return;
    items = [];
    clearStatus();
    render();
  });

  mergeBtn.addEventListener('click', async function () {
    if (items.length === 0) return;

    // 每次执行前重新探测，防止脚本时序问题
    var PDFLib = getPDFLib();
    if (!PDFLib) {
      setStatus('error',
        'pdf-lib 库未加载，无法合并。请检查网络或按 Ctrl + F5 刷新。');
      return;
    }

    mergeBtn.disabled = true;

    try {
      setStatus('loading', '正在合并 PDF…');

      var merged = await PDFLib.PDFDocument.create();

      for (var i = 0; i < items.length; i++) {
        setStatus('loading', '正在处理：' + items[i].name +
          '（' + (i + 1) + ' / ' + items.length + '）');

        var buf = await items[i].file.arrayBuffer();
        var src = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
        var pages = await merged.copyPages(src, src.getPageIndices());
        pages.forEach(function (p) { merged.addPage(p); });
      }

      var bytes = await merged.save();
      var blob = new Blob([bytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'merged-' + Date.now() + '.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);

      setStatus('success', '合并完成，PDF 已开始下载');
    } catch (err) {
      console.error(err);
      setStatus('error', '失败：' + (err.message || err));
    } finally {
      mergeBtn.disabled = false;
    }
  });

  render();
})();
</script>
</body>
</html>
