<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拆分 PDF</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "SimSun", sans-serif;
    background: #fafafa;
    margin: 0;
    padding: 24px;
    color: #333;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .drop {
    border: 2px dashed #bbb;
    border-radius: 6px;
    padding: 32px;
    text-align: center;
    color: #888;
    cursor: pointer;
    background: #fff;
    transition: all 0.2s;
  }
  .drop:hover, .drop.over {
    border-color: #4a90d9;
    background: #f0f7ff;
    color: #4a90d9;
  }
  .drop input { display: none; }
  .mode {
    margin-top: 16px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 16px;
  }
  .mode .row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .mode .row:last-child { margin-bottom: 0; }
  .mode label { cursor: pointer; user-select: none; }
  .mode input[type="text"] {
    padding: 6px 10px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 3px;
    width: 220px;
  }
  .hint {
    font-size: 12px;
    color: #999;
    line-height: 1.6;
    margin-top: 8px;
  }
  .toolbar {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    padding: 9px 18px;
    background: #4a90d9;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #357ab8; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  button.ghost {
    background: #fff;
    color: #4a90d9;
    border: 1px solid #4a90d9;
  }
  button.ghost:hover { background: #f0f7ff; }
  #status {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    display: none;
    line-height: 1.6;
  }
  #status.loading { display: block; background: #e8f4fd; color: #2a6fa8; }
  #status.error   { display: block; background: #fdecea; color: #c0392b; }
  #status.success { display: block; background: #eafaf1; color: #27ae60; }
  #info {
    margin-top: 14px;
    font-size: 13px;
    color: #555;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="drop" id="drop">
    <input type="file" id="file" accept=".pdf">
    <div>点击选择 PDF，或拖到这里</div>
  </div>

  <div id="info"></div>

  <div class="mode" id="modeBox" style="display:none;">
    <div class="row">
      <label><input type="radio" name="mode" value="each" checked> 每页拆成单独 PDF（打包成 ZIP）</label>
      <label><input type="radio" name="mode" value="range"> 提取指定页码范围（生成一个 PDF）</label>
    </div>
    <div class="row" id="rangeRow" style="display:none;">
      <span>页码范围：</span>
      <input type="text" id="rangeInput" placeholder="例如：1-3,5,7-9">
      <span class="hint">用逗号分隔，可混用单页和区间</span>
    </div>
  </div>

  <div class="toolbar">
    <button id="splitBtn" disabled>拆分并下载</button>
    <button class="ghost" id="clearBtn" disabled>清空</button>
  </div>

  <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
(function () {
  var drop      = document.getElementById('drop');
  var fileEl    = document.getElementById('file');
  var splitBtn  = document.getElementById('splitBtn');
  var clearBtn  = document.getElementById('clearBtn');
  var statusEl  = document.getElementById('status');
  var infoEl    = document.getElementById('info');
  var modeBox   = document.getElementById('modeBox');
  var rangeRow  = document.getElementById('rangeRow');
  var rangeInput= document.getElementById('rangeInput');

  var picked = null;
  var pageCount = 0;

  function setStatus(type, msg) {
    statusEl.className = type;
    statusEl.textContent = msg;
  }
  function clearStatus() {
    statusEl.className = '';
    statusEl.textContent = '';
  }

  // 模式切换
  document.querySelectorAll('input[name="mode"]').forEach(function (r) {
    r.addEventListener('change', function () {
      rangeRow.style.display = r.value === 'range' && r.checked ? 'flex' : 'none';
    });
  });

  // 选择文件
  drop.addEventListener('click', function () { fileEl.click(); });
  fileEl.addEventListener('change', function (e) {
    if (e.target.files.length) pick(e.target.files[0]);
  });
  ['dragenter', 'dragover'].forEach(function (evt) {
    drop.addEventListener(evt, function (e) {
      e.preventDefault(); drop.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (evt) {
    drop.addEventListener(evt, function (e) {
      e.preventDefault(); drop.classList.remove('over');
    });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer.files.length) pick(e.dataTransfer.files[0]);
  });

  async function pick(f) {
    if (!/\.pdf$/i.test(f.name)) {
      setStatus('error', '只支持 .pdf 文件');
      return;
    }
    picked = f;
    pageCount = 0;
    infoEl.textContent = '';
    modeBox.style.display = 'none';
    splitBtn.disabled = true;
    clearBtn.disabled = false;

    try {
      setStatus('loading', '正在读取 PDF 信息…');
      var buf = await f.arrayBuffer();
      var pdf = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
      pageCount = pdf.getPageCount();
      infoEl.innerHTML =
        '<strong>' + f.name + '</strong> · 共 ' + pageCount + ' 页';
      modeBox.style.display = 'block';
      splitBtn.disabled = false;
      setStatus('success', '准备就绪，选择拆分方式后点击按钮');
    } catch (err) {
      console.error(err);
      setStatus('error', '无法读取 PDF：' + (err.message || err));
    }
  }

  clearBtn.addEventListener('click', function () {
    picked = null;
    pageCount = 0;
    infoEl.textContent = '';
    modeBox.style.display = 'none';
    splitBtn.disabled = true;
    clearBtn.disabled = true;
    clearStatus();
    fileEl.value = '';
  });

  // 解析页码范围 "1-3,5,7-9"
  function parseRange(str, max) {
    var pages = [];
    str.split(',').forEach(function (part) {
      part = part.trim();
      if (!part) return;
      var m = part.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m) {
        var a = parseInt(m[1], 10), b = parseInt(m[2], 10);
        if (a > b) { var t = a; a = b; b = t; }
        for (var i = a; i <= b; i++) {
          if (i >= 1 && i <= max) pages.push(i - 1);
        }
      } else if (/^\d+$/.test(part)) {
        var n = parseInt(part, 10);
        if (n >= 1 && n <= max) pages.push(n - 1);
      }
    });
    return pages;
  }

  splitBtn.addEventListener('click', async function () {
    if (!picked) return;
    splitBtn.disabled = true;

    try {
      var mode = document.querySelector('input[name="mode"]:checked').value;
      var buf = await picked.arrayBuffer();
      var src = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
      var baseName = picked.name.replace(/\.pdf$/i, '');

      if (mode === 'each') {
        // 每页单独 PDF，打包 ZIP
        setStatus('loading', '正在拆分每一页…');
        var zip = new JSZip();
        var folder = zip.folder(baseName);

        for (var i = 0; i < pageCount; i++) {
          setStatus('loading', '正在生成第 ' + (i + 1) + ' / ' + pageCount + ' 页…');
          var out = await PDFLib.PDFDocument.create();
          var copied = await out.copyPages(src, [i]);
          out.addPage(copied[0]);
          var bytes = await out.save();
          var name = 'page-' + String(i + 1).padStart(3, '0') + '.pdf';
          folder.file(name, bytes);
        }

        setStatus('loading', '正在打包 ZIP…');
        var zipBlob = await zip.generateAsync({ type: 'blob' });
        downloadBlob(zipBlob, baseName + '-split.zip');
        setStatus('success', '拆分完成，ZIP 已开始下载');
      } else {
        // 提取页码范围
        var rangeStr = rangeInput.value.trim();
        if (!rangeStr) {
          setStatus('error', '请输入页码范围，例如 1-3,5');
          splitBtn.disabled = false;
          return;
        }
        var idxs = parseRange(rangeStr, pageCount);
        if (idxs.length === 0) {
          setStatus('error', '页码范围无效，或超出文档总页数');
          splitBtn.disabled = false;
          return;
        }

        setStatus('loading', '正在提取 ' + idxs.length + ' 页…');
        var out2 = await PDFLib.PDFDocument.create();
        var copied2 = await out2.copyPages(src, idxs);
        copied2.forEach(function (p) { out2.addPage(p); });
        var bytes2 = await out2.save();
        var blob2 = new Blob([bytes2], { type: 'application/pdf' });

        var suffix = idxs.length === 1 ? '-page-' + (idxs[0] + 1) : '-extract';
        downloadBlob(blob2, baseName + suffix + '.pdf');
        setStatus('success', '提取完成，PDF 已开始下载');
      }
    } catch (err) {
      console.error(err);
      setStatus('error', '失败：' + (err.message || err));
    } finally {
      splitBtn.disabled = false;
    }
  });

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
})();
</script>
</body>
</html>
